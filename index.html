<title>残高帳 Zandaka</title>
<meta name="description" content="保有銘柄と枚数から、いまの評価額を確かめる暗号資産の残高帳。Check what your crypto is worth now. No keys or addresses.">
<meta name="theme-color" content="#1B5E63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="残高帳">

<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#16202E; --muted:#5B6676; --line:#DDE3EA;
  --accent:#1B5E63; --accent-ink:#FFFFFF; --accent-soft:#E1EEEE;
  --up:#1F7A4D; --down:#B23A3A; --warn:#A07A16;
  --f:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1520; --card:#171F2C; --ink:#E6EBF2; --muted:#9AA6B6; --line:#2A3544;
  --accent:#6FC2C3; --accent-ink:#0F1520; --accent-soft:#1B3236;
  --up:#5CC48E; --down:#E57373; --warn:#D9B64E; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.5}
body{padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:12px}
header.top{display:flex;justify-content:space-between;align-items:center}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.04em}
.icon-btn{border:0;background:none;padding:8px;border-radius:10px;color:var(--ink);cursor:pointer;min-width:40px;min-height:40px}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:22px;height:22px;display:block}
.total{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px}
.total .label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.total .amt{font-size:34px;font-weight:700;letter-spacing:-.01em;word-break:break-all}
.total .sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin-top:10px}
.bar i{display:block;height:100%}
.status{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.status .err{color:var(--warn)}
.up{color:var(--up)} .down{color:var(--down)}
ul.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
ul.list li{border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;width:100%;cursor:pointer}
.row:active{background:var(--accent-soft)}
.badge.icon{background:var(--accent-soft);overflow:hidden}
.badge.icon img{width:28px;height:28px;display:block}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;font-family:var(--mono)}
.row .mid{min-width:0;display:flex;flex-direction:column}
.row .sym{font-weight:700}
.row .name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.row .val{font-weight:600}
.row .meta{font-size:12px;color:var(--muted)}
.row .tgt{font-size:11px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-size:18px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.sub{background:var(--accent-soft);color:var(--ink)}
.btn.danger{background:none;color:var(--down);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;display:grid;place-items:center}
.fab svg{width:28px;height:28px}
[hidden]{display:none!important}
.note{font-size:12px;color:var(--muted);line-height:1.6}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{margin:0;font-size:18px}
.sheet .head{display:flex;justify-content:space-between;align-items:center}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:17px;width:100%;color:var(--ink)}
textarea.inp{font-family:var(--mono);font-size:12px;min-height:120px}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.results button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:10px 8px;border-radius:10px;cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results .rk{margin-left:auto;font-size:11px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw}
.hidden-amt .amtv{filter:blur(7px)}
.hr{border:0;border-top:1px solid var(--line);width:100%;margin:0}
.note a{color:var(--accent)}
.sect{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:4px 4px -6px}
/* 7日間の小さなチャート・銘柄の詳細・トークン憲章 */
.row.has-spark{grid-template-columns:auto 1fr auto auto}
.spark{width:56px;height:24px;display:block}
.spark path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.coin-head{display:flex;align-items:center;gap:12px;min-width:0}
.coin-head .t{display:flex;flex-direction:column;min-width:0}
.coin-head .t b{font-size:18px}
.coin-price{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.coin-price .p{font-size:24px;font-weight:700}
.ranges{display:flex;gap:6px}
.ranges button{flex:1;border:1px solid var(--line);background:none;border-radius:10px;padding:8px 0;cursor:pointer;font-size:13px}
.ranges button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.chart{width:100%;max-width:100%;aspect-ratio:320/150;display:block}
.chart .area{fill:currentColor;opacity:.12;stroke:none}
.chart .line{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.chart-box{min-height:120px;display:grid;align-items:center;padding-bottom:6px}
.chart-box .note{text-align:center}
.mine{display:flex;justify-content:space-between;align-items:center;gap:4px 10px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:12px 14px}
.mine .muted{white-space:nowrap}
.charter{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.charter .g{display:flex;align-items:center;gap:10px}
.charter .g > span:last-child{min-width:0}
.grade{flex:none;font-weight:800;font-size:18px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.charter dl{margin:0;display:grid;gap:6px}
.charter dt{font-size:12px;color:var(--muted)}
.charter dd{margin:0;font-size:14px}
.charter a{color:var(--accent)}
@media (max-width:359px){.spark{display:none}.row.has-spark{grid-template-columns:auto 1fr auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ===== 保存（この端末の中だけ） ===== */
const KEY = "zandaka.v1";
const sysLang = (navigator.language || "ja").toLowerCase().startsWith("ja") ? "ja" : "en";
const DEFAULT = { holdings: [], prices: {}, icons: {}, updatedAt: null, settings: { lang: sysLang, currency: sysLang === "ja" ? "jpy" : "usd", apiKey: "", interval: 120, hide: false, charts: true } };
function fresh() { return JSON.parse(JSON.stringify(DEFAULT)); }
const merge = s => Object.assign(fresh(), s, { settings: Object.assign({}, DEFAULT.settings, s.settings || {}) });
/* 鍵：かけているあいだ、保存するのは暗号にした中身だけ。開ける鍵（CK）は開いているあいだだけ手元に持つ */
let LOCK = null, CK = null, locked = false;
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.lock && s.ct) { LOCK = s.lock; locked = true; const f = fresh(); if (L[s.lang]) f.settings.lang = s.lang; return f; }
    if (s && Array.isArray(s.holdings)) return merge(s);
  } catch (e) {}

}
let S = load();
const t = k => L[S.settings.lang][k];
let saving = Promise.resolve();
function save() {
  if (!LOCK) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast(t("noStore")); } return; }
  if (!CK) return;   // 鍵がかかっている画面では書かない
  const snap = JSON.parse(JSON.stringify(S)), key = CK, lk = LOCK;
  saving = saving.then(async () => { const box = await seal(key, snap); if (LOCK !== lk) return;   // そのあいだにロックを外した・消去したときは書かない
    localStorage.setItem(KEY, JSON.stringify(Object.assign({ lock: lk, lang: snap.settings.lang }, box))); }).catch(() => toast(t("noStore")));
}
const te = new TextEncoder(), td = new TextDecoder();
const b64 = u => { let x = ""; new Uint8Array(u).forEach(c => x += String.fromCharCode(c)); return btoa(x); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const AES = { name: "AES-GCM", length: 256 };
async function pinKey(pin, salt) { const k = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt, iterations: 600000 }, k, AES, false, ["encrypt", "decrypt"]); }
async function prfKey(bytes, salt) { const k = await crypto.subtle.importKey("raw", bytes, "HKDF", false, ["deriveKey"]); return crypto.subtle.deriveKey({ name: "HKDF", hash: "SHA-256", salt, info: te.encode("zandaka-lock") }, k, AES, false, ["encrypt", "decrypt"]); }
async function seal(key, obj) { const iv = rnd(12); const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj))); return { iv: b64(iv), ct: b64(ct) }; }
async function unseal(key, box) { return JSON.parse(td.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(box.iv) }, key, unb64(box.ct)))); }
async function passkeyBytes(rawId, salt) {
  const a = await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: "public-key", id: rawId }], userVerification: "required", extensions: { prf: { eval: { first: salt } } } } });
  const r = a && a.getClientExtensionResults().prf;
  if (!r || !r.results || !r.results.first) throw new Error("noprf");
  return new Uint8Array(r.results.first);
}
async function passkeyLock() {
  const salt = rnd(32);
  const c = await navigator.credentials.create({ publicKey: { rp: { name: t("app") }, user: { id: rnd(16), name: "zandaka", displayName: t("app") }, challenge: rnd(32),
    pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }], authenticatorSelection: { residentKey: "preferred", userVerification: "required" }, extensions: { prf: { eval: { first: salt } } } } });
  const r = c.getClientExtensionResults().prf;
  if (!r || r.enabled === false) throw new Error("noprf");
  const bytes = r.results && r.results.first ? new Uint8Array(r.results.first) : await passkeyBytes(c.rawId, salt);

async function pinLock(pin) { const salt = rnd(16); return { lock: { kind: "pin", num: true, salt: b64(salt) }, key: await pinKey(pin, salt) }; }
const NUMPAD = 'inputmode="numeric" pattern="[0-9]*"';
// 鍵をかける：書いたものを読み戻して開けられると確かめてから、鍵つきにする
async function enableLock(got) {
  await saving;
  const snap = JSON.parse(JSON.stringify(S));   // 確かめているあいだに価格が更新されても、比べる中身が変わらないように
  const box = await seal(got.key, snap);
  if (JSON.stringify(await unseal(got.key, box)) !== JSON.stringify(snap)) throw new Error("verify");
  localStorage.setItem(KEY, JSON.stringify(Object.assign({ lock: got.lock, lang: snap.settings.lang }, box)));
  LOCK = got.lock; CK = got.key;
  save();   // 確かめているあいだの変更も、暗号にして保存する
}
async function disableLock() { await saving; LOCK = null; CK = null; save(); }
async function unlockWith(key) {
  const raw = JSON.parse(localStorage.getItem(KEY));
  S = merge(await unseal(key, raw)); CK = key; locked = false;
}
function lockNow() {
  if (!LOCK) return;
  CK = null; locked = true; clearInterval(timer);
  const lang = S.settings.lang; S = fresh(); S.settings.lang = lang;
  close(); render();
}

/* ===== 価格サービス（CoinGecko） ===== */
const API = "https://api.coingecko.com/api/v3";
function apiUrl(path, params) {
  const u = new URL(API + path);
  Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
  if (S.settings.apiKey) u.searchParams.set("x_cg_demo_api_key", S.settings.apiKey);
  return u.toString();
}
let fetching = false, lastError = "";
async function refresh(manual) {
  if (fetching || locked) return;
  const ids = [...new Set(S.holdings.map(h => h.id))];
  if (!ids.length) { render(); return; }
  fetching = true; lastError = ""; render();
  try {
    const cur = S.settings.currency;
    const r = await fetch(apiUrl("/coins/markets", { vs_currency: cur, ids: ids.join(","), per_page: "250", price_change_percentage: "24h", sparkline: "true" }));
    if (r.status === 429) throw new Error(t("busy"));
    if (!r.ok) throw new Error(t("priceFail")(r.status));
    const j = await r.json();
    (Array.isArray(j) ? j : []).forEach(m => {
      if (m.current_price != null) S.prices[m.id] = { p: m.current_price, c: m.price_change_percentage_24h ?? null, cur, s: thin(m.sparkline_in_7d && m.sparkline_in_7d.price, 40) };
      if (m.image && !S.icons[m.id]) cacheIcon(m.id, m.image);
    });
    S.updatedAt = Date.now(); save();
    if (manual) toast(t("updated"));
  } catch (e) {
    lastError = e.message && !/Failed to fetch|Load failed|NetworkError/.test(e.message) ? e.message : t("netFail");
  } finally { fetching = false; render(); }
}
// 7日間の値動き：形だけ使うので、点を間引いて小さく保存する
function thin(a, n) {
  if (!Array.isArray(a)) return null;
  const v = a.filter(x => typeof x === "number" && isFinite(x)); if (v.length < 2) return null;
  const out = []; for (let i = 0; i < n; i++) out.push(+v[Math.round(i * (v.length - 1) / (n - 1))].toPrecision(6));
  return out;
}
async function search(q) {
  const r = await fetch(apiUrl("/search", { query: q }));
  if (r.status === 429) throw new Error(t("searchBusy"));
  if (!r.ok) throw new Error(t("searchFail"));
  const j = await r.json();
  return (j.coins || []).slice(0, 12).map(c => ({ id: c.id, sym: (c.symbol || "").toUpperCase(), name: c.name, rank: c.market_cap_rank, img: c.large || c.thumb }));
}

function price(v) { if (v == null) return "—"; const c = CUR[S.settings.currency]; const d = v >= 1000 ? 0 : v >= 1 ? 2 : v >= 0.01 ? 4 : 8; return new Intl.NumberFormat(loc(), { style: "currency", currency: c.code, maximumFractionDigits: d, minimumFractionDigits: 0 }).format(v); }

}

  const d = pts.map((p, i) => (i ? "L" : "M") + (i * (W - 2) / (pts.length - 1) + 1).toFixed(1) + " " + (H - 2 - (p - lo) / span * (H - 4)).toFixed(1)).join("");
  const cls = pts[pts.length - 1] > pts[0] ? "up" : pts[pts.length - 1] < pts[0] ? "down" : "muted";

function compute() {
  const rows = S.holdings.map(h => { const pr = S.prices[h.id]; const ok = pr && pr.cur === S.settings.currency; const v = ok ? pr.p * h.amount : null; return { h, p: ok ? pr.p : null, c: ok ? pr.c : null, v }; });

  const editing = !!h;
  sheet(`<div class="head"><h2>${esc(c.sym)} <span class="muted" style="font-size:14px;font-weight:400">${esc(c.name)}</span></h2>${closeBtn()}</div>

    <label class="f" for="tgt">${t("tgt")}<input class="inp num" id="tgt" inputmode="decimal" placeholder="${t("tgtPh")}" value="${editing && h.target ? h.target : ""}"></label>
    <label class="f" for="memo">${t("memo")}<input class="inp" id="memo" placeholder="${t("memoPh")}" value="${editing ? esc(h.memo || "") : ""}"></label>
    <p class="note" id="a-msg" style="margin:0">${t("multi")}</p>
    <div class="actions"><button class="btn" id="a-save">${editing ? t("save") : t("addBtn")}</button>${editing ? `<button class="btn danger" id="a-del">${t("del")}</button>` : ""}</div>
    ${editing ? `<div id="confirm" hidden><p style="margin:0">${esc(t("delQ")(c.sym))}</p><div class="actions" style="margin-top:10px"><button class="btn danger" id="a-del2">${t("delYes")}</button><button class="btn sub" id="a-cancel">${t("cancel")}</button></div></div>` : ""}`, () => {
    setTimeout(() => $("#amt").focus(), 50);
    const err = m => { $("#a-msg").textContent = m; $("#a-msg").style.color = "var(--down)"; };
    $("#a-save").onclick = () => {
      const a = parseFloat(toHalf($("#amt").value));
      const tv = $("#tgt").value.trim(); const tg = tv ? parseFloat(toHalf(tv)) : 0;
      if (!(a > 0)) return err(t("badAmt"));
      if (tv && !(tg >= 0 && tg <= 100)) return err(t("badTgt"));
      const memo = $("#memo").value.trim().slice(0, 60);
      if (editing) { Object.assign(h, { amount: a, target: tg, memo }); delete h.sample; }
      else S.holdings.push({ uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), id: c.id, sym: c.sym, name: c.name, amount: a, target: tg, memo });
      if (c.img && !S.icons[c.id]) cacheIcon(c.id, c.img);

    };
    if (editing) {
      $("#a-del").onclick = () => { $("#confirm").hidden = false; $("#a-del").disabled = true; };
      $("#a-cancel").onclick = () => { $("#confirm").hidden = true; $("#a-del").disabled = false; };
      $("#a-del2").onclick = () => { S.holdings = S.holdings.filter(x => x !== h); save(); close(); render(); toast(t("deleted")); };
    }
  });
}
/* ===== 銘柄の詳細（大きなチャートとトークン憲章） ===== */
const RANGES = ["1", "7", "30", "365"];
const chartCache = {};
async function loadChart(id, days) {
  const key = id + "|" + S.settings.currency + "|" + days, c = chartCache[key];
  if (c && Date.now() - c.at < 5 * 60000) return c.pts;
  const r = await fetch(apiUrl("/coins/" + encodeURIComponent(id) + "/market_chart", { vs_currency: S.settings.currency, days }));
  if (r.status === 429) throw new Error(t("busy"));
  if (!r.ok) throw new Error(t("chartFail"));
  const j = await r.json();
  const raw = (j.prices || []).filter(x => Array.isArray(x) && isFinite(x[0]) && isFinite(x[1]));
  if (raw.length < 2) throw new Error(t("chartFail"));
  const step = Math.max(1, Math.ceil(raw.length / 120)), pts = raw.filter((x, i) => i % step === 0 || i === raw.length - 1);
  chartCache[key] = { at: Date.now(), pts }; return pts;
}
function chartSvg(pts, days) {
  const W = 320, H = 150, T = 14, B = 20, ps = pts.map(x => x[1]);
  const lo = Math.min(...ps), hi = Math.max(...ps), span = hi - lo || 1, t0 = pts[0][0], t1 = pts[pts.length - 1][0];
  const X = ts => ((ts - t0) / ((t1 - t0) || 1)) * (W - 2) + 1, Y = p => T + (1 - (p - lo) / span) * (H - T - B);
  const line = pts.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + " " + Y(x[1]).toFixed(1)).join("");
  const area = line + "L" + X(t1).toFixed(1) + " " + (H - B) + "L" + X(t0).toFixed(1) + " " + (H - B) + "Z";
  const cls = ps[ps.length - 1] > ps[0] ? "up" : ps[ps.length - 1] < ps[0] ? "down" : "muted";
  const fmt = ts => new Date(ts).toLocaleString(loc(), days === "1" ? { hour: "2-digit", minute: "2-digit" } : days === "365" ? { year: "numeric", month: "numeric" } : { month: "numeric", day: "numeric" });
  return `<svg class="chart ${cls}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(price(lo))} – ${esc(price(hi))}">
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    <text x="2" y="10">${esc(price(hi))}</text><text x="2" y="${H - B - 4}">${esc(price(lo))}</text>
    <text x="1" y="${H - 5}">${esc(fmt(t0))}</text><text x="${W - 1}" y="${H - 5}" text-anchor="end">${esc(fmt(t1))}</text></svg>`;
}
// トークン憲章：同じ場所（nndahedeyo.github.io）に公開されている生データを読む
let charter = null;
async function loadCharter() {
  if (charter) return charter;
  const base = new URL("../token-charter/", location.href);
  const [tk, cr] = await Promise.all(["data/tokens.json", "data/criteria.json"].map(f => fetch(new URL(f, base)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })));
  if (!tk || !Array.isArray(tk.tokens) || !cr || !Array.isArray(cr.items)) throw new Error("format");
  charter = { tk, cr, page: new URL(S.settings.lang === "en" ? "en/" : "", base).href };
  return charter;
}
const safeUrl = u => /^https:\/\//.test(String(u || "")) ? String(u) : "";
function charterHtml(id) {
  const tok = charter.tk.tokens.find(x => x.coingecko === id);
  const link = `<a href="${esc(charter.page)}" target="_blank" rel="noopener">${t("chOpen")}</a>`;
  if (!tok) return `<p class="note" style="margin:0">${t("chNone")}</p>${link}`;
  const en = S.settings.lang === "en", g = charter.cr.grades, v = (tok.scores || []).filter(x => x != null);
  const n = v.length ? Math.round(v.reduce((a, b) => a + b, 0) / (2 * v.length) * 100) : null;
  const grade = n == null ? "—" : n >= g.A ? "A" : n >= g.B ? "B" : n >= g.C ? "C" : n >= g.D ? "D" : "E";
  const item = no => { const it = charter.cr.items.find(i => i.no === no), sc = (tok.scores || [])[no - 1];
    if (!it) return ""; const txt = sc == null ? t("chNA") : en ? it["score" + sc + "_en"] : it["score" + sc];
    return `<dt>${esc(en ? it.name_en : it.name)}</dt><dd>${esc(txt)}</dd>`; };
  const src = (tok.sources || []).map(x => safeUrl(x.url) ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(en ? (x.title_en || new URL(x.url).hostname) : x.title)}</a>` : "").filter(Boolean).join("<br>");
  return `<div class="g"><span class="grade">${grade}</span><span>${n == null ? "" : esc(t("chScore")(grade, n))}<br><span class="note">${esc(t("chConf")(t("chConfK")[tok.confidence] || tok.confidence))} · ${esc(t("chAt")(tok.reviewed))}</span></span></div>
    <p style="margin:0">${esc(en ? (tok.note_en || tok.note) : tok.note)}</p>
    <dl>${item(3)}${item(7)}</dl>
    ${src ? `<p class="note" style="margin:0">${t("chSrc")}<br>${src}</p>` : ""}${link}`;
}
let coinDays = "7";
function openCoin(uid) {
  const h = S.holdings.find(x => x.uid === uid); if (!h) return;
  const pr = S.prices[h.id], ok = pr && pr.cur === S.settings.currency;
  sheet(`<div class="head"><div class="coin-head">${badge(h)}<span class="t"><b>${esc(h.sym)}</b><span class="note" style="margin:0">${esc(h.name)}</span></span></div>${closeBtn()}</div>
    <div class="coin-price"><span class="p num">${ok ? price(pr.p) : "—"}</span><span class="num ${ok && pr.c > 0 ? "up" : ok && pr.c < 0 ? "down" : "muted"}">${t("h24")} ${ok ? pct(pr.c, true) : "—"}</span></div>
    <div class="ranges" role="group">${RANGES.map((d, i) => `<button type="button" data-days="${d}" aria-pressed="${d === coinDays}">${t("ranges")[i]}</button>`).join("")}</div>
    <div class="chart-box" id="chart"><p class="note">${t("chartLoading")}</p></div>
    <div class="mine"><span class="muted">${t("hold")}</span><span class="num amtv">${qty(h.amount)} · ${ok ? money(pr.p * h.amount) : "—"}</span></div>

    const draw = async () => {
      const box = Ly.querySelector("#chart"), days = coinDays; if (!box) return;

    };
    Ly.querySelectorAll("[data-days]").forEach(b => b.onclick = () => { coinDays = b.dataset.days; Ly.querySelectorAll("[data-days]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); draw(); });
    Ly.querySelector("#c-edit").onclick = () => openEdit(uid);
    draw();
    loadCharter().then(() => { const el = Ly.querySelector("#charter"); if (el && el.isConnected) el.innerHTML = charterHtml(h.id); })
      .catch(() => { const el = Ly.querySelector("#charter"); if (el && el.isConnected) el.innerHTML = `<p class="note" style="margin:0">${t("chFail")}</p>`; });
  });
}

    <p class="note" id="l-msg" style="margin:0"></p>

    <p class="note" style="margin:0">${t("safety")}</p>`, () => {

      save(); schedule(); close(); render(); toast(t("saved")); if (curChanged) refresh();
    };
    const dump = () => JSON.stringify({ app: "zandaka", v: 1, holdings: S.holdings.map(({ id, sym, name, amount, target, memo }) => ({ id, sym, name, amount, target, memo })) }, null, 1);
    $("#b-copy").onclick = async () => { try { await navigator.clipboard.writeText(dump()); $("#b-msg").textContent = t("copied"); } catch (e) { $("#imp").value = dump(); $("#imp").select(); $("#b-msg").textContent = t("copyFallback"); } };
    $("#b-file").onclick = () => { const b = new Blob([dump()], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "zandaka-backup-" + new Date().toISOString().slice(0, 10) + ".json"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); $("#b-msg").textContent = t("fileSaved"); };
    $("#b-imp").onclick = () => {
      try { const j = JSON.parse($("#imp").value); const hs = (j.holdings || []).filter(h => h && typeof h.id === "string" && h.amount > 0).map(h => ({ uid: Math.random().toString(36).slice(2, 10), id: h.id, sym: String(h.sym || h.id).toUpperCase().slice(0, 12), name: String(h.name || h.id).slice(0, 60), amount: +h.amount, target: +h.target || 0, memo: String(h.memo || "").slice(0, 60) }));

function renderLock() {
  const pin = LOCK.kind === "pin";
  $("#view").innerHTML = `<section class="empty">
    <h2>${t("lkH")}</h2>
    ${pin ? `<label class="f" for="lk-pin" style="width:100%;text-align:left">${LOCK.num ? t("lkPinL") : t("lkPinL").replace(/（.*）| \(.*\)/, "")}<input class="inp" id="lk-pin" type="password" ${LOCK.num ? NUMPAD : ""} autocomplete="current-password"></label>` : ""}
    <div class="actions" style="width:100%"><button class="btn" id="lk-open">${pin ? t("lkOpen") : t("lkOpenPass")}</button></div>
    <p class="note" id="lk-msg" style="margin:0" role="status"></p>
  </section>
  <details class="note" style="margin-top:16px"><summary>${t("lkLost")}</summary><p>${t("lkLostP")}</p>
    <div class="actions"><button class="btn danger" id="lk-wipe">${t("lkWipe")}</button></div>
    <div id="lk-wc" hidden><p style="margin:0">${t("wipeQ")}</p><div class="actions" style="margin-top:10px"><button class="btn danger" id="lk-wy">${t("wipeYes")}</button><button class="btn sub" id="lk-wn">${t("cancel")}</button></div></div>
  </details>`;
  const msg = m => { $("#lk-msg").textContent = m; };
  let busy = false;
  const open = async () => {
    if (busy) return; busy = true; msg(t("lkWorking"));
    try {
      const salt = unb64(LOCK.salt);
      const key = pin ? await pinKey(LOCK.num ? toHalf($("#lk-pin").value.trim()) : $("#lk-pin").value, salt) : await prfKey(await passkeyBytes(unb64(LOCK.cred), salt), salt);
      await unlockWith(key);
      S.holdings.forEach(x => { if (!x.uid) x.uid = Math.random().toString(36).slice(2, 10); });
      render(); schedule(); refresh();
    } catch (e) { busy = false; msg(pin ? t("lkBad") : t("lkPassFail")); if (pin) { $("#lk-pin").value = ""; $("#lk-pin").focus(); } }
  };
  $("#lk-open").onclick = open;
  if (pin) $("#lk-pin").onkeydown = e => { if (e.key === "Enter") open(); };
  $("#lk-wipe").onclick = () => { $("#lk-wc").hidden = false; };
  $("#lk-wn").onclick = () => { $("#lk-wc").hidden = true; };
  $("#lk-wy").onclick = () => { const lang = S.settings.lang; LOCK = null; CK = null; locked = false; S = fresh(); S.settings.lang = lang; save(); render(); toast(t("wiped")); };
}

let tt;
function toast(m) { document.querySelectorAll(".toast").forEach(x => x.remove()); const d = document.createElement("div"); d.className = "toast"; d.setAttribute("role", "status"); d.textContent = m; document.body.appendChild(d); clearTimeout(tt); tt = setTimeout(() => d.remove(), 2200); }

/* ===== 起動 ===== */
let timer;
function schedule() { clearInterval(timer); if (S.settings.interval > 0) timer = setInterval(() => { if (document.visibilityState === "visible") refresh(); }, S.settings.interval * 1000); }
$("#btn-add").onclick = openAdd;
$("#btn-settings").onclick = openSettings;
$("#btn-refresh").onclick = () => refresh(true);
$("#btn-eye").onclick = () => { S.settings.hide = !S.settings.hide; save(); render(); };
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
  if (LOCK && !locked && hiddenAt && Date.now() - hiddenAt > 60000) return lockNow();   // 1分以上ほかのアプリにいたら鍵をかける
  if (!S.updatedAt || Date.now() - S.updatedAt > 60000) refresh();
});
S.holdings.forEach(x => { if (!x.uid) x.uid = Math.random().toString(36).slice(2, 10); });
render(); if (!locked) { schedule(); refresh(); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
